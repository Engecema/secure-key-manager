[tox]

[testenv]
deps=
    pytest
    coverage
passenv=
    PYTHONASYNCIODEBUG
    PYTHONDEVMODE
commands=
    coverage run --source=Gerenciador de Chaves Segura \
        '--omit=Gerenciador de Chaves Segura/gui/*,Gerenciador de Chaves Segura/plugins/*,Gerenciador de Chaves Segura/scripts/*' \
        -m pytest tests -v
    coverage report
extras=
    tests
    qml_gui
